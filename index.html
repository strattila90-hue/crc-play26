<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CRC PLAY</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0f172a; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; }
    #game { width:100%; height:100vh; display:flex; flex-direction:column; }
    canvas { width:100%; flex:1; background:#1e293b; display:block; }
    .ui { padding:6px; background:#1e293b; display:flex; flex-wrap:wrap; gap:4px; }
    button { padding:8px 10px; background:#334155; color:#fff; border:none; border-radius:6px; font-size:12px; }
    button.active { background:#1e40af; }
    .menu { text-align:center; padding:30px 16px; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .menu button { font-size:18px; padding:16px 32px; margin:8px; }
    .exit-btn { position:absolute; top:8px; right:8px; background:#b91c1c; z-index:10; }
  </style>
</head>
<body>
  <div id="game">
    <div id="menu" class="menu">
      <h1>CRC PLAY</h1>
      <p>Magyar Honvédség szakasz + GIDRAN</p>
      <button onclick="start('oszlató')">Oszlató (MH)</button>
      <button onclick="start('tüntető')" style="background:#b91c1c">Tüntető</button>
    </div>
    <canvas id="c" width="900" height="450" style="display:none"></canvas>
    <button id="exitBtn" class="exit-btn" style="display:none" onclick="exitGame()">Kilépés</button>
    <div id="controls" class="ui" style="display:none"></div>
  </div>

  <script>
    let side = 'oszlató', formation = 'vonal', running = false, score = 0;
    let squad = [], protesters = [], molotovs = [], keys = {};
    let gidran = { x: 40, y: 220 };
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const images = {};
    function loadImg(name, src) {
      const img = new Image();
      img.src = src;
      images[name] = img;
    }
    loadImg('soldier', '/images/soldier.png');
    loadImg('protester', '/images/protester.png');
    loadImg('gidran', '/images/gidran.png');

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function start(s) {
      side = s;
      document.getElementById('menu').style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('exitBtn').style.display = 'block';
      init();
      running = true;
      loop();
    }

    function exitGame() {
      if (!confirm('Kilépés?')) return;
      running = false;
      document.getElementById('menu').style.display = 'flex';
      canvas.style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      document.getElementById('exitBtn').style.display = 'none';
    }

    function init() {
      // Teljes szakasz: 3 raj + törzs ≈ 27 fő
      squad = [];
      const roles = ['PK','ALT','HÍR','SNIP','MG','MG','SHOT','SHOT','EXT','EXT'];
      for (let i = 0; i < 27; i++) {
        const raj = Math.floor(i / 9);
        squad.push({
          x: 180 + (i % 9) * 28 + raj * 10,
          y: 240 + raj * 8,
          h: 100,
          shield: i % 3 !== 1,
          role: roles[i % roles.length],
          vx: 0, vy: 0
        });
      }
      protesters = Array.from({ length: 18 }, (_, i) => ({
        x: 650 + i * 18,
        y: 250 + Math.sin(i) * 6,
        h: 60,
        vx: 0, vy: 0
      }));
      molotovs = [];
      score = 0;
      buildControls();
    }

    function buildControls() {
      const forms = ['vonal','ék','doboz','oszlop'];
      const cmds = ['pajzsot fel','pajzsot le','gázálarcot fel','vízágyú'];
      let html = forms.map(f => `<button onclick="formation='${f}'">${f}</button>`).join('');
      html += cmds.map(c => `<button onclick="doCmd('${c}')">${c}</button>`).join('');
      document.getElementById('controls').innerHTML = html;
    }

    function doCmd(c) {
      if (c === 'pajzsot fel') squad.forEach(s => s.shield = true);
      if (c === 'pajzsot le') squad.forEach(s => s.shield = false);
    }

    function update() {
      // Nyilas irányítás (egész szakasz)
      let speed = 0;
      if (keys['ArrowRight'] || keys['d']) speed = 1.2;
      if (keys['ArrowLeft'] || keys['a']) speed = -1.2;
      squad.forEach(s => { s.vx = speed; s.x += s.vx; });
      gidran.x += speed * 0.9;

      // Formáció
      const base = gidran.x + 150;
      squad.forEach((s, i) => {
        const raj = Math.floor(i / 9);
        const pos = i % 9;
        if (formation === 'ék') s.x = base + pos * 22 + raj * 40;
        else if (formation === 'doboz') s.x = base + (pos % 5) * 32 + raj * 30;
        else if (formation === 'oszlop') s.x = base + pos * 14 + raj * 20;
        else s.x = base + pos * 26 + raj * 25;
        s.y = 230 + raj * 12;
      });

      // Tüntető fizika
      protesters.forEach(p => {
        if (p.h <= 0) return;
        p.vx += (Math.random() - 0.5) * 0.15;
        p.vx *= 0.96;
        p.x += p.vx;
        if (Math.random() < 0.008) {
          molotovs.push({ x: p.x, y: p.y, vx: -2.5 - Math.random(), vy: -1.5, life: 120 });
        }
      });

      // Molotov fizika
      molotovs.forEach(m => {
        m.x += m.vx;
        m.y += m.vy;
        m.vy += 0.08;
        m.life--;
      });
      molotovs = molotovs.filter(m => m.life > 0 && m.y < 380);

      // Ütközés
      squad.forEach(s => {
        if (s.h <= 0) return;
        protesters.forEach(p => {
          if (p.h > 0 && Math.abs(s.x - p.x) < 28) {
            p.h -= 0.4;
            s.h -= s.shield ? 0.08 : 0.25;
          }
        });
        molotovs.forEach(m => {
          if (Math.abs(m.x - s.x) < 18 && Math.abs(m.y - s.y) < 30) {
            s.h -= s.shield ? 0.6 : 2;
            m.life = 0;
          }
        });
      });

      score = protesters.filter(p => p.h <= 0).length * 8 + squad.filter(s => s.h > 0).length;
    }

    function draw() {
      ctx.clearRect(0, 0, 900, 450);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 900, 450);
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 300, 900, 150);

      // GIDRAN
      const g = images.gidran;
      if (g && g.complete) ctx.drawImage(g, gidran.x, gidran.y - 5, 130, 70);
      else { ctx.fillStyle = '#4d7c0f'; ctx.fillRect(gidran.x, gidran.y, 120, 55); }

      // Katonák
      squad.forEach(s => {
        if (s.h <= 0) return;
        const img = images.soldier;
        if (img && img.complete) {
          ctx.drawImage(img, s.x - 8, s.y - 10, 40, 72);
        } else {
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(s.x, s.y, 28, 55);
          if (s.shield) { ctx.fillStyle = 'rgba(180,220,255,0.6)'; ctx.fillRect(s.x - 8, s.y - 5, 12, 60); }
        }
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(s.x, s.y - 6, 28 * (s.h / 100), 3);
      });

      // Tüntetők
      protesters.forEach(p => {
        if (p.h <= 0) return;
        const img = images.protester;
        if (img && img.complete) ctx.drawImage(img, p.x - 6, p.y - 8, 32, 62);
        else { ctx.fillStyle = '#b91c1c'; ctx.fillRect(p.x, p.y, 22, 48); }
      });

      // Molotovok
      molotovs.forEach(m => {
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.arc(m.x, m.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`CRC PLAY | ${formation.toUpperCase()} | ${Math.floor(score)} pont | Nyilak: mozgás`, 12, 24);
    }

    function loop() {
      if (!running) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
